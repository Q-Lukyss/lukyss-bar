services:
  postgres:
    image: postgres:16-alpine
    container_name: lukyss-bar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lukyssbar}
      POSTGRES_USER: ${POSTGRES_USER:-lukyss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      TZ: Europe/Paris
    # Pas de port publié sur l'hôte en prod, ni de réseau Traefik (accessible
    # uniquement depuis le réseau docker par défaut de ce projet).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lukyss} -d ${POSTGRES_DB:-lukyssbar}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # api et web se versionnent indépendamment (tags git séparés api-vX.Y.Z /
    # web-vX.Y.Z, cf. .github/workflows/cd.yml) : chacun a son propre tag
    # d'image, pas un IMAGE_TAG partagé.
    image: ${GHCR_IMAGE_API:-ghcr.io/q-lukyss/lukyss-bar-api}:${IMAGE_TAG_API:-latest}
    container_name: lukyss-bar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lukyss}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lukyssbar}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est requis}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL est requis (domaine prod exact de web)}
      PORT: 3001
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.lukyss-bar-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.lukyss-bar-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lukyss-bar-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.lukyss-bar-api.loadbalancer.server.port=3001

  web:
    # NEXT_PUBLIC_API_URL est inlinée AU BUILD de cette image (build-arg côté
    # CI, cf. .github/workflows/cd.yml) : elle ne peut pas être changée ici au
    # démarrage du conteneur, contrairement aux autres variables d'env.
    image: ${GHCR_IMAGE_WEB:-ghcr.io/q-lukyss/lukyss-bar-web}:${IMAGE_TAG_WEB:-latest}
    container_name: lukyss-bar-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik-public
    environment:
      NODE_ENV: production
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.lukyss-bar-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.lukyss-bar-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.lukyss-bar-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.lukyss-bar-web.loadbalancer.server.port=3000

  # Dump quotidien + rotation, sans code à écrire. Voir
  # https://github.com/prodrigestivill/docker-postgres-backup-local
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: lukyss-bar-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-lukyssbar}
      POSTGRES_USER: ${POSTGRES_USER:-lukyss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pgbackups:/backups

networks:
  # Réseau externe de la stack Traefik déjà déployée sur le VPS (en dehors de
  # ce projet) — web/api le rejoignent en plus du réseau par défaut, pour que
  # Traefik puisse les router. Nom exact à renseigner dans .env
  # (TRAEFIK_NETWORK), cf. README "Reverse proxy (Traefik)".
  traefik-public:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  pgdata:
  pgbackups:
