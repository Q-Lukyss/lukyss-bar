services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lukyssbar
      POSTGRES_USER: lukyss
      POSTGRES_PASSWORD: lukyssbar
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts .sql/.sh exécutés au 1er démarrage seulement
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lukyss -d lukyssbar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
