[package]
name = "lukyss-bar-api"
version = "0.1.0"
edition = "2024"
default-run = "lukyss-bar-api"

[[bin]]
name = "lukyss-bar-api"
path = "src/main.rs"

[[bin]]
name = "export_types"
path = "src/bin/export_types.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-extra = "0.12.6"
tokio = { version = "1.53.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["full"] }

# logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# OpenAPI documentation
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# SQLx
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

# Gestion d'erreurs
thiserror = "2.0.19"
anyhow = "1.0.104"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# utils divers
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
ulid = { version = "1.2", features = ["serde"] }

# auth
jsonwebtoken = "9.3"
bcrypt = "0.17"

# websocket registry
dashmap = "6.1"

# upload validation
infer = "0.19"

# stockage des images (Cloudflare R2, API compatible S3)
aws-sdk-s3 = "1"

# conversion des images uploadées en webp
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3"

# génération de types TS partagés avec le frontend
ts-rs = { version = "10.1", features = ["chrono-impl", "uuid-impl"] }

rand = "0.9"
